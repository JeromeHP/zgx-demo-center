# Money rules for PA-25-301 (NIH Parent R01, Clinical Trial Not Allowed), curated by
# hand from the real sources and quoted so each can be checked against them. Merged into
# requirements.json by scripts/build_scenario_solicitation.py --real; read there by the
# agent's check_budget and by scripts/validate_vault.py.

cap_usd:
  value: null
  quote: "Application budgets are not limited but need to reflect the actual needs of the proposed project."
  source: https://grants.nih.gov/grants/guide/pa-files/PA-25-301.html

max_years:
  value: 5
  quote: "The maximum project period is 5 years."
  source: https://grants.nih.gov/grants/guide/pa-files/PA-25-301.html

salary_cap_usd:
  value: 228000
  quote: "January 1, 2026 through September 30, 2026 (Executive Level II): $228,000"
  source: https://grants.nih.gov/policy-and-compliance/policy-topics/nih-fiscal-policies/salary-cap-summary

# NIH did NOT move to the revised 2 CFR 200 thresholds ($50,000): the NOFO says the
# 45 CFR 75 indirect-cost provisions still apply to NIH awards, and 45 CFR 75.2 puts
# only the first $25,000 of each subaward in the MTDC base.
subaward_mtdc_limit_usd:
  value: 25000
  quote: >-
    "for NIH, under the Consolidated Appropriations Act for FY 2026 ... the provisions relating to
    indirect costs in 45 CFR 75 continue to apply to NIH awards." 45 CFR 75.2: MTDC includes "up to
    the first $25,000 of each subaward (regardless of the period of performance of the subawards
    under the award)".
  source: https://www.ecfr.gov/on/2025-09-30/title-45/part-75/section-75.2

prior_approval_direct_usd:
  value: 500000
  quote: >-
    "any applicant requesting $500,000 or more in direct costs (excluding consortium F&A costs) in
    any one budget period within a competitive segment is required to contact the NIH Institute or
    Center (IC) Program Official (PO) ... as early as possible"
  source: https://grants.nih.gov/grants/guide/notice-files/NOT-OD-17-005.html
