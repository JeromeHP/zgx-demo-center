# Money rules for NSF 25-523 (EPSCoR E-CORE), quoted from the solicitation and from
# 2 CFR 200 as revised in 2024.

cap_usd:
  value: 10000000
  quote: "Funding requests must be for a duration of four (4) years, with a maximum budget of up to $10 million total."
  source: https://www.nsf.gov/funding/opportunities/e-core-epscor-research-infrastructure-improvement-program-epscor/nsf25-523/solicitation

max_years:
  value: 4
  quote: "Funding requests must be for a duration of four (4) years"
  source: https://www.nsf.gov/funding/opportunities/e-core-epscor-research-infrastructure-improvement-program-epscor/nsf25-523/solicitation

cost_share:
  value: prohibited
  quote: >-
    "Committed cost sharing is not allowed for the new E-CORE awards; however, cost share is
    required for the E-CORE four-year renewal project awards"
  source: https://www.nsf.gov/funding/opportunities/e-core-epscor-research-infrastructure-improvement-program-epscor/nsf25-523/solicitation

subaward_mtdc_limit_usd:
  value: 50000
  quote: '2 CFR 200.1: MTDC includes "up to the first $50,000 of each subaward".'
  source: https://www.ecfr.gov/current/title-2/section-200.1

equipment_threshold_usd:
  value: 10000
  quote: "revised to increase the equipment threshold from $5,000 to $10,000 to align with updates provided in Title 2 CFR § 200."
  source: https://www.nsf.gov/policies/document/pappg24-1-supplement-1

# Not a budget arithmetic rule: the agent checks the letters. Recorded here with its source.
letters_of_support:
  value: prohibited
  quote: >-
    "Letters of support are not allowed ... However, up to ten letters of collaboration (two pages or
    fewer) from partners or jurisdictional officials may be included"
  source: https://www.nsf.gov/funding/opportunities/e-core-epscor-research-infrastructure-improvement-program-epscor/nsf25-523/solicitation
