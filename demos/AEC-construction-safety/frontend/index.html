<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafetyBot - Construction Safety Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .header h1 {
            color: #FF6B00;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        
        .header .subtitle {
            color: #666;
            font-size: 1rem;
        }
        
        .connection-status {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 10px 15px;
            border-radius: 5px;
            z-index: 1000;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: slideInRight 0.3s ease;
        }
        
        .connection-status.connected {
            background: #4CAF50;
            color: white;
        }
        
        .connection-status.disconnected {
            background: #f44336;
            color: white;
        }
        
        .connection-status.offline-mode {
            background: #FF9800;
            color: white;
        }
        
        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .voice-button {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FF6B00, #FF8E53);
            border: none;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin: 2rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(255, 107, 0, 0.3);
        }
        
        .voice-button:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(255, 107, 0, 0.4);
        }
        
        .voice-button.listening {
            animation: pulse 1.5s infinite;
            background: linear-gradient(135deg, #CC5500, #FF6B00);
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .voice-icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }
        
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .quick-btn {
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        
        .quick-btn:hover {
            background: #FF6B00;
            color: white;
            border-color: #FF6B00;
            transform: translateY(-2px);
        }
        
        .quick-btn .icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            display: block;
        }
        
        .input-area {
            margin-bottom: 2rem;
        }
        
        .text-input {
            width: 100%;
            padding: 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }
        
        .text-input:focus {
            outline: none;
            border-color: #FF6B00;
        }
        
        .response-area {
            background: #f0f9ff;
            border-left: 4px solid #4CAF50;
            padding: 1.5rem;
            border-radius: 10px;
            margin-top: 1rem;
            display: none;
        }
        
        .response-area.active {
            display: block;
            animation: slideIn 0.3s ease;
        }
        
        .response-area.offline-response {
            background: #fff8e1;
            border-left-color: #FF9800;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .response-header {
            color: #4CAF50;
            font-weight: bold;
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }
        
        .response-header.offline {
            color: #FF9800;
        }
        
        .response-text {
            color: #333;
            line-height: 1.6;
        }
        
        .response-mode {
            font-size: 0.9rem;
            color: #666;
            margin-top: 0.5rem;
            font-style: italic;
        }
        
        .speak-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            margin-top: 1rem;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        
        .speak-btn:hover {
            background: #45a049;
        }
        
        .loading {
            text-align: center;
            padding: 2rem;
            display: none;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #FF6B00;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .emergency-banner {
            background: #D32F2F;
            color: white;
            padding: 1rem;
            text-align: center;
            border-radius: 10px;
            margin-top: 2rem;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        
        .emergency-banner:hover {
            background: #B71C1C;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🦺 Donnelly Construction Safety App</h1>
            <p class="subtitle" data-zgx-device="Powered by {}">Powered by this AI Station</p>
        </div>
        
        <div class="quick-actions">
            <button class="quick-btn" onclick="askQuestion('What PPE do I need?')">
                <span class="icon">⛑️</span>
                <span>PPE Check</span>
            </button>
            <button class="quick-btn" onclick="askQuestion('Ladder safety rules?')">
                <span class="icon">🪜</span>
                <span>Ladder Safety</span>
            </button>
            <button class="quick-btn" onclick="askQuestion('Emergency procedures?')">
                <span class="icon">🚨</span>
                <span>Emergency</span>
            </button>
            <button class="quick-btn" onclick="askQuestion('Hot work permit requirements?')">
                <span class="icon">🔥</span>
                <span>Hot Work</span>
            </button>
        </div>
        
        <!-- Voice input removed — browser Web Speech API routes audio to Google's cloud STT, which breaks the air-gapped story. Could be rewired later to getUserMedia -> local Whisper on the Nano. -->

        <div class="input-area">
            <input 
                type="text" 
                class="text-input" 
                id="textInput" 
                placeholder="Type your safety question here..."
                onkeypress="handleKeyPress(event)"
            />
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 1rem; color: #666;">Getting safety information...</p>
        </div>
        
        <div class="response-area" id="responseArea">
            <div class="response-header" id="responseHeader">Safety Guidance:</div>
            <div class="response-text" id="responseText"></div>
            <div class="response-mode" id="responseMode"></div>
            <button class="speak-btn" onclick="speakResponse()">🔊 Read Aloud</button>
        </div>
        
        <div class="emergency-banner" onclick="showEmergency()">
            🚨 EMERGENCY ASSISTANCE
        </div>
    </div>
    
    <script>
        const API_URL = 'http://' + window.location.hostname + ':8191';
        let isListening = false;
        let currentResponse = '';
        let backendStatus = 'checking';
        let isModelLoaded = false;
        
        // Offline fallback responses
        const OFFLINE_RESPONSES = {
            'ppe': 'Required PPE includes hard hat (ANSI Z89.1 compliant), safety glasses, high-visibility vest, steel-toed boots, and work gloves. Additional PPE required based on specific tasks.',
            'ladder': 'Maintain three points of contact at all times. Inspect before each use. Set at 4:1 ratio. Extend 3 feet above landing. Never exceed weight rating. Always face ladder when climbing.',
            'emergency': 'Call 911 immediately for serious injuries. Alert site supervisor. Do not move injured persons unless in immediate danger. Evacuate to designated assembly point. Account for all personnel.',
            'hot work': 'Obtain hot work permit before starting. Clear area of combustibles within 35 feet. Have fire watch during and 30 minutes after work. Keep fire extinguisher readily available.',
            'fall': 'Use OSHA-approved fall protection when working 6+ feet above ground. Inspect harnesses before each use. Ensure anchor points rated for 5,000 lbs. Maintain 100% tie-off.',
            'scaffold': 'Scaffolds must be erected by competent persons only. Inspect before each shift. Ensure proper guardrails and planking. Never exceed rated load capacity.',
            'electrical': 'De-energize and lockout/tagout all energy sources. Test with meter to verify zero energy. Each worker applies own lock. Follow written LOTO procedures.',
            'default': 'This is an important safety question. For immediate guidance, consult your site safety officer or refer to your company\'s safety manual.'
        };
        
        // Test connection on load
        window.onload = async function() {
            await checkBackendConnection();
            
            // Re-check connection every 5 seconds
            setInterval(checkBackendConnection, 5000);
        };
        
        async function checkBackendConnection() {
            try {
                const response = await fetch(`${API_URL}/`);
                const data = await response.json();
                console.log('Backend status:', data);
                
                backendStatus = 'connected';
                isModelLoaded = data.model_loaded;
                
                showConnectionStatus(
                    isModelLoaded ? 'connected' : 'offline-mode',
                    isModelLoaded ? '✓ AI Model Active' : '⚠️ Offline Mode Active'
                );
                
            } catch (error) {
                console.error('Backend not connected:', error);
                backendStatus = 'disconnected';
                isModelLoaded = false;
                
                showConnectionStatus('disconnected', '⚠️ Running Locally Only');
            }
        }
        
        function showConnectionStatus(statusClass, message) {
            // Remove existing status
            const existingStatus = document.querySelector('.connection-status');
            if (existingStatus) {
                existingStatus.remove();
            }
            
            // Create new status
            const statusDiv = document.createElement('div');
            statusDiv.className = `connection-status ${statusClass}`;
            statusDiv.textContent = message;
            document.body.appendChild(statusDiv);
            
            // Auto-hide after 3 seconds if connected
            if (statusClass === 'connected') {
                setTimeout(() => statusDiv.remove(), 3000);
            }
        }
        
        // Voice input removed — browser Web Speech API routes audio to Google's cloud STT,
        // which breaks the air-gapped story. Could be rewired later to getUserMedia -> local
        // Whisper on the Nano. The typed Q&A (askQuestion -> POST /ask) and local speechSynthesis
        // read-aloud below remain the supported, fully-offline paths.

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                const question = document.getElementById('textInput').value;
                if (question.trim()) {
                    askQuestion(question);
                }
            }
        }
        
        async function askQuestion(question) {
            document.getElementById('textInput').value = question;
            document.getElementById('loading').classList.add('active');
            document.getElementById('responseArea').classList.remove('active');
            
            // Try backend first if connected
            if (backendStatus === 'connected') {
                try {
                    const response = await fetch(`${API_URL}/ask`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            question: question,
                            context: 'General Construction Site'
                        })
                    });
                    
                    const data = await response.json();
                    currentResponse = data.answer;
                    
                    displayResponse(currentResponse, data.mode === 'ai' ? 'AI Model' : 'Offline Database');
                    
                } catch (error) {
                    console.error('API Error:', error);
                    // Fallback to local responses
                    handleOfflineResponse(question);
                }
            } else {
                // Use offline responses
                handleOfflineResponse(question);
            }
        }
        
        function handleOfflineResponse(question) {
            const questionLower = question.toLowerCase();
            let response = OFFLINE_RESPONSES.default;
            
            // Find best matching response
            for (const [key, value] of Object.entries(OFFLINE_RESPONSES)) {
                if (questionLower.includes(key)) {
                    response = value;
                    break;
                }
            }
            
            currentResponse = response;
            displayResponse(response, 'Local Safety Database');
        }
        
        function displayResponse(response, mode) {
            document.getElementById('responseText').textContent = response;
            document.getElementById('responseMode').textContent = `Source: ${mode}`;
            
            const responseArea = document.getElementById('responseArea');
            const responseHeader = document.getElementById('responseHeader');
            
            if (mode === 'Local Safety Database') {
                responseArea.classList.add('offline-response');
                responseHeader.classList.add('offline');
                responseHeader.textContent = 'Safety Guidance (Offline):';
            } else {
                responseArea.classList.remove('offline-response');
                responseHeader.classList.remove('offline');
                responseHeader.textContent = 'Safety Guidance:';
            }
            
            document.getElementById('loading').classList.remove('active');
            responseArea.classList.add('active');
            
            // Auto-speak if it was a voice query
            if (isListening) {
                speakResponse();
            }
        }
        
        function speakResponse() {
            if ('speechSynthesis' in window && currentResponse) {
                // Cancel any ongoing speech
                speechSynthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance(currentResponse);
                utterance.rate = 0.9; // Slightly slower for clarity
                utterance.pitch = 1;
                utterance.volume = 1;
                
                // Add error handling
                utterance.onerror = function(event) {
                    console.error('Speech synthesis error:', event);
                };
                
                speechSynthesis.speak(utterance);
            }
        }
        
        function showEmergency() {
            const message = `EMERGENCY PROCEDURES:

1. Call 911 immediately
2. Alert site supervisor
3. Clear the area  
4. Do not move injured persons unless in immediate danger
5. Provide first aid if trained

Site Emergency Number: 555-0100
Safety Manager: 555-0101`;
            
            alert(message);
            
            // Also speak emergency instructions
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance('Emergency! Call 911 immediately and alert site supervisor.');
                utterance.rate = 0.8;
                utterance.volume = 1;
                speechSynthesis.speak(utterance);
            }
        }
    </script>
<script>
// Demo Center iframe escape relay
(function() {
  if (window.parent === window) return; // not iframed, do nothing
  window.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      window.parent.postMessage({ type: 'demo-shell-return' }, '*');
    }
  });
})();
</script>
<!-- zgx-device-label:begin (generated by scripts/sync_device_label.sh) -->
<script>
// Fill any [data-zgx-device] element with the machine the Demo Center detected.
//
// Every demo frontend used to hardcode "Powered by HP ZGX Nano" -- and the
// pharmacy one went further with "with NVIDIA Grace Blackwell GB10". At an
// AMD-funded show those lines sell the wrong vendor from the demo's own screen,
// and there is no way to fix them except editing HTML per event.
//
// The attribute's value is a template; "{}" is replaced by the device label.
//   <span data-zgx-device="Powered by {}">Powered by this AI Station</span>
//
// If /sysinfo cannot be reached the element keeps whatever it already says, so
// the fallback text in the markup must name NO vendor. A demo that stays
// generic is fine; a demo that confidently names the wrong silicon is not.
//
// Source of truth: demos/scripts/zgx-device-label.js. The copies inlined into
// each frontend are kept in sync by scripts/sync_device_label.sh, and checked
// by scripts/audit_hardware_strings.sh.
(function () {
  var els = document.querySelectorAll('[data-zgx-device]');
  if (!els.length) return;
  fetch('http://' + location.hostname + ':8086/sysinfo')
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (hw) {
      if (!hw || !hw.device_label) return;
      for (var i = 0; i < els.length; i++) {
        var tpl = els[i].getAttribute('data-zgx-device') || '{}';
        els[i].textContent = tpl.replace('{}', hw.device_label);
      }
    })
    .catch(function () { /* offline or launcher not running: keep the neutral text */ });
})();
</script>
<!-- zgx-device-label:end -->
<!-- zgx-ui:begin (generated by scripts/sync_ui.py — edit demos/ui/, not this) -->
<style>
/* ZGX demo chrome — the shared frame every demo wears.
 *
 * Fixed: the bar, the meter strip, the footer. Free: everything between them.
 * Tokens live on :root so a demo can match its own palette without forking the
 * layout; scripts/audit_ui_standard.sh checks nobody forks the layout anyway.
 *
 * The meter vocabulary (.zgx-meter / -label / -value / -sub) is lifted from
 * grant-machine's web/styles.css, which already had it working — including
 * font-variant-numeric: tabular-nums, the detail that stops a climbing counter
 * jittering as its digits change width.
 */

:root {
  --zgx-bar-bg: #0e1420;
  --zgx-bar-fg: #e6edf6;
  --zgx-bar-dim: #8fa3bd;
  --zgx-bar-line: #1f2b3d;
  --zgx-accent: #0096d6;         /* HP blue */
  --zgx-ok: #35c46b;
  --zgx-warn: #d9a441;
  --zgx-bar-h: 56px;
}

#zgx-chrome { display: none; }   /* the marker element itself is never shown */

.zgx-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--zgx-bar-h);
  z-index: 2147483000;           /* above demo overlays, below nothing */
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 16px;
  background: var(--zgx-bar-bg);
  color: var(--zgx-bar-fg);
  border-bottom: 1px solid var(--zgx-bar-line);
  font: 500 13px/1.2 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing: border-box;
}
.zgx-bar *, .zgx-bar *::before, .zgx-bar *::after { box-sizing: border-box; }

/* The approved logo artwork has an opaque white background, so it sits on a
 * light plate rather than being alpha-keyed. */
.zgx-logo-plate {
  flex: 0 0 auto;
  background: #fff;
  border-radius: 6px;
  padding: 4px 7px;
  display: flex;
  align-items: center;
}
.zgx-logo-plate img { display: block; height: 30px; width: auto; }

.zgx-titles { flex: 0 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.zgx-title { font-size: 14px; font-weight: 650; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.zgx-subtitle { font-size: 11px; color: var(--zgx-bar-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.zgx-meters { flex: 1 1 auto; display: flex; gap: 14px; justify-content: flex-end; align-items: center; overflow: hidden; }

.zgx-meter { display: flex; flex-direction: column; align-items: flex-end; min-width: 62px; }
.zgx-meter-label { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--zgx-bar-dim); white-space: nowrap; }
.zgx-meter-value {
  font-size: 17px; font-weight: 700; line-height: 1.15;
  font-variant-numeric: tabular-nums;   /* keeps a counting number from jittering */
  white-space: nowrap;
}
.zgx-meter-sub { font-size: 10px; color: var(--zgx-bar-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
.zgx-meter-value.zgx-unknown { color: var(--zgx-bar-dim); font-weight: 500; }
.zgx-meter-value.zgx-accent { color: var(--zgx-accent); }

.zgx-sep { width: 1px; align-self: stretch; margin: 10px 0; background: var(--zgx-bar-line); flex: 0 0 auto; }

.zgx-device { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; max-width: 210px; }
.zgx-device-label { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 210px; }
.zgx-device-sub { font-size: 10px; color: var(--zgx-bar-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 210px; }

/* The chrome is fixed, so the page is pushed down by exactly its height. */
body.zgx-chromed { padding-top: var(--zgx-bar-h) !important; }

/* The chrome owns the logo, so a demo's own copy is hidden rather than shown
 * twice. Five demos shipped their own hp_logo.png (three DIFFERENT files under
 * the same name), and stacking the canonical one above a divergent one is the
 * opposite of a standard.
 *
 * Safe to match this broadly: the chrome's own logo is a data: URI, so it can
 * never match src*="hp_logo". Rule removed and the demo's logo returns. */
body.zgx-chromed img[src*="hp_logo"] { display: none !important; }

.zgx-foot {
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: 2147482999;
  display: flex; justify-content: space-between; align-items: center;
  gap: 12px; padding: 4px 14px;
  background: var(--zgx-bar-bg); color: var(--zgx-bar-dim);
  border-top: 1px solid var(--zgx-bar-line);
  font: 500 11px/1.3 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
body.zgx-chromed-foot { padding-bottom: 26px !important; }
.zgx-foot .zgx-local { color: var(--zgx-ok); }

@media (max-width: 1100px) {
  .zgx-meter:nth-child(n+5) { display: none; }   /* shed the least critical meters first */
  .zgx-subtitle { display: none; }
}
@media (max-width: 760px) {
  .zgx-meters { display: none; }

<script>
/* ZGX demo chrome — builds the shared bar and owns every poll.
 *
 * One rule this file will not bend: a value that was not received renders as an
 * em-dash, never as 0. Zero watts, zero degrees and zero tokens are all readings
 * an audience will believe. This project has repeatedly found meters that showed
 * a plausible number while measuring nothing — a hardcoded "102 GB / 128 GB"
 * captioned as live NVML, a launcher bar of typed-in green ticks, a token count
 * that was a chars/4 guess. The chrome does not add to that list.
 *
 * Data sources, both optional:
 *   GET  {launcher}/telemetry   host GPU/CPU — read by the BROWSER, not the
 *                               demo's backend, so containerised demos with no
 *                               GPU tooling and no host route still show it.
 *   GET  ./api/metrics          the demo's own tokens. 404 = no LLM, panel hidden.
 *   GET  {launcher}/sysinfo     device identity.
 */
(function () {
  "use strict";

  var mount = document.getElementById("zgx-chrome");
  if (!mount || window.__zgxChromeLoaded) return;
  window.__zgxChromeLoaded = true;

  var LAUNCHER = "http://" + location.hostname + ":8086";
  var DASH = "—";

  var cfg = {
    title: mount.getAttribute("data-title") || document.title || "ZGX Demo",
    subtitle: mount.getAttribute("data-subtitle") || "",
    logo: mount.getAttribute("data-logo") || "hp_logo.png",
    metrics: mount.getAttribute("data-metrics") || "/api/metrics",
    foot: mount.getAttribute("data-foot") !== "off"
  };

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function meter(id, label, sub) {
    var m = el("div", "zgx-meter");
    m.appendChild(el("span", "zgx-meter-label", label));
    var v = el("span", "zgx-meter-value zgx-unknown", DASH);
    v.id = "zgx-" + id;
    m.appendChild(v);
    var s = el("span", "zgx-meter-sub", sub || "");
    s.id = "zgx-" + id + "-sub";
    m.appendChild(s);
    return m;
  }

  // ── build ────────────────────────────────────────────────────────────────
  var bar = el("div", "zgx-bar");

  var plate = el("div", "zgx-logo-plate");
  var img = document.createElement("img");
  img.src = cfg.logo;
  img.alt = "HP";
  // A demo served from a subpath may not resolve the relative logo; fall back
  // to the launcher's copy rather than showing a broken-image glyph on stage.
  img.onerror = function () {
    if (img.dataset.fellBack) { plate.style.display = "none"; return; }
    img.dataset.fellBack = "1";
    img.src = LAUNCHER + "/ui/brand/hp_logo.png";
  };
  plate.appendChild(img);
  bar.appendChild(plate);

  var titles = el("div", "zgx-titles");
  titles.appendChild(el("div", "zgx-title", cfg.title));
  if (cfg.subtitle) titles.appendChild(el("div", "zgx-subtitle", cfg.subtitle));
  bar.appendChild(titles);

  var meters = el("div", "zgx-meters");
  var tokenPanel = el("div", "zgx-meters");          // hidden until /api/metrics answers
  tokenPanel.style.display = "none";
  tokenPanel.style.flex = "0 0 auto";
  tokenPanel.appendChild(meter("tokens", "Tokens", "this session"));
  tokenPanel.appendChild(meter("tps", "Tok/s", ""));
  meters.appendChild(tokenPanel);
  meters.appendChild(el("div", "zgx-sep"));
  meters.appendChild(meter("gpu", "GPU", ""));
  meters.appendChild(meter("power", "Power", ""));
  meters.appendChild(meter("temp", "Temp", ""));
  meters.appendChild(meter("mem", "Memory", ""));
  meters.appendChild(meter("cpu", "CPU", ""));
  bar.appendChild(meters);

  bar.appendChild(el("div", "zgx-sep"));
  var dev = el("div", "zgx-device");
  var devLabel = el("div", "zgx-device-label", DASH);
  devLabel.id = "zgx-device-label";
  var devSub = el("div", "zgx-device-sub", "");
  devSub.id = "zgx-device-sub";
  dev.appendChild(devLabel);
  dev.appendChild(devSub);
  bar.appendChild(dev);

  document.body.appendChild(bar);
  document.body.classList.add("zgx-chromed");

  if (cfg.foot) {
    var foot = el("div", "zgx-foot");
    var left = el("span", "zgx-local", "All inference on this device · no cloud");
    var right = el("span", null, "");
    right.id = "zgx-foot-right";
    foot.appendChild(left);
    foot.appendChild(right);
    document.body.appendChild(foot);
    document.body.classList.add("zgx-chromed-foot");
  }

  // ── render helpers ───────────────────────────────────────────────────────
  function set(id, value, unit, digits) {
    var n = document.getElementById("zgx-" + id);
    if (!n) return;
    if (value === null || value === undefined || value === "" || Number.isNaN(value)) {
      n.textContent = DASH;
      n.classList.add("zgx-unknown");
      return;
    }
    var shown = (typeof value === "number" && digits !== undefined) ? value.toFixed(digits) : value;
    n.textContent = shown + (unit || "");
    n.classList.remove("zgx-unknown");
  }
  function setSub(id, text) {
    var n = document.getElementById("zgx-" + id + "-sub");
    if (n) n.textContent = text == null ? "" : text;
  }

  // ── hardware, from the launcher ──────────────────────────────────────────
  function pollTelemetry() {
    fetch(LAUNCHER + "/telemetry", { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (t) {
        if (!t) throw new Error("no telemetry");
        set("gpu", t.util_pct, "%");
        set("power", t.power_w, " W", 0);
        set("temp", t.temp_c, "°C");
        set("mem", t.mem_used_gb, " GB", 1);
        setSub("mem", t.mem_total_gb ? "of " + t.mem_total_gb + " GB" : "");
        set("cpu", t.cpu_pct, "%", 0);
        setSub("cpu", t.ram_pct != null ? "RAM " + Math.round(t.ram_pct) + "%" : "");
        setSub("gpu", t.source && t.source !== "none" ? t.source : "");
        var fr = document.getElementById("zgx-foot-right");
        if (fr) {
          fr.textContent = [t.vendor && t.vendor !== "unknown" ? t.vendor : null,
                            t.source && t.source !== "none" ? t.source : null]
                           .filter(Boolean).join(" · ");
        }
      })
      .catch(function () {
        // Launcher down: clear every hardware meter. Leaving the last reading
        // on screen would be a stale number presented as live.
        ["gpu", "power", "temp", "mem", "cpu"].forEach(function (k) { set(k, null); setSub(k, ""); });
      });
  }

  // ── tokens, from the demo itself ─────────────────────────────────────────
  var tokensSupported = null;
  function pollMetrics() {
    if (tokensSupported === false) return;
    fetch(cfg.metrics, { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (m) {
        if (!m || typeof m.total_tokens !== "number") throw new Error("no metrics");
        tokensSupported = true;
        tokenPanel.style.display = "";
        var approx = m.estimated ? "≈" : "";
        set("tokens", approx + m.total_tokens.toLocaleString());
        setSub("tokens", m.requests != null ? m.requests + " request" + (m.requests === 1 ? "" : "s") : "this session");
        set("tps", m.tps, "", 1);
      })
      .catch(function () {
        // A demo with no LLM serves no /api/metrics. Hide the panel rather than
        // show a zero that would read as "this demo processed nothing".
        if (tokensSupported === null) { tokensSupported = false; tokenPanel.style.display = "none"; }
      });
  }

  function loadIdentity() {
    fetch(LAUNCHER + "/sysinfo", { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (hw) {
        if (!hw) return;
        var label = document.getElementById("zgx-device-label");
        var sub = document.getElementById("zgx-device-sub");
        label.textContent = label.title = hw.device_label || DASH;
        // Some vendors' device names run long (marketing name plus arch id); the CSS
        // ellipsizes both lines and the title keeps the full text on hover.
        sub.textContent = sub.title =
          [hw.accelerator !== "unknown" ? hw.accelerator : null, hw.arch].filter(Boolean).join(" · ");
      })
      .catch(function () {
        document.getElementById("zgx-device-label").textContent = "hardware unknown";
      });
  }

  loadIdentity();
  pollTelemetry();
  pollMetrics();
  setInterval(pollTelemetry, 2000);
  setInterval(pollMetrics, 2000);
})();
</script>
<!-- zgx-ui:end -->
</body>
</html>
