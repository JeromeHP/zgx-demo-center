<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical AI Drug Interaction Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #024AD8 0%, #0356E8 40%, #4A90E2 70%, #87CEEB 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-content {
            flex: 1;
            text-align: center;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .logo {
            height: 60px;
            object-fit: contain;
        }

        .logo-left {
            margin-right: 20px;
        }

        .logo-right {
            margin-left: 20px;
        }

        .main-content {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .mode-selector {
            background: #f0f4f8;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .mode-button {
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
            color: #333;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .mode-button.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .input-section {
            margin-bottom: 30px;
        }

        .input-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .simple-mode, .complex-mode {
            display: none;
        }

        .simple-mode.active, .complex-mode.active {
            display: block;
        }

        .drug-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            color: #555;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .medication-list {
            background: #f8f9ff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            min-height: 50px;
        }

        .medication-item {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            margin: 5px;
            font-size: 0.95em;
        }

        .medication-item .remove {
            margin-left: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .add-medication-row {
            display: flex;
            gap: 10px;
        }

        .add-medication-row input {
            flex: 1;
        }

        .add-button {
            background: #10b981;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .add-button:hover {
            background: #059669;
            transform: translateY(-1px);
        }

        .condition-checkboxes {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 10px;
            background: #f8f9ff;
            border-radius: 6px;
        }

        .checkbox-item input {
            margin-right: 8px;
        }

        .analyze-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.2em;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            display: block;
            margin: 30px auto;
        }

        .analyze-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .analyze-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 30px 0;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results-section {
            margin-top: 40px;
            display: none;
        }

        .results-section.show {
            display: block;
        }

        .results-section h2 {
            color: #333;
            margin-bottom: 25px;
            font-size: 1.8em;
        }

        .result-card {
            background: #f8f9ff;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
            border-left: 5px solid #667eea;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .result-title {
            color: #667eea;
            font-size: 1.3em;
            font-weight: bold;
        }

        .risk-badge {
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.95em;
        }

        .risk-low {
            background: #d4edda;
            color: #155724;
        }

        .risk-moderate {
            background: #fff3cd;
            color: #856404;
        }

        .risk-high {
            background: #f8d7da;
            color: #721c24;
        }

        .result-content {
            color: #333;
            font-size: 1.05em;
            line-height: 1.8;
            white-space: pre-wrap;
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }

        .inference-time {
            color: #666;
            font-size: 0.9em;
            margin-top: 15px;
            text-align: right;
        }

        .sample-queries {
            background: #e8f4f8;
            border-left: 4px solid #0891b2;
            padding: 20px;
            margin: 30px 0;
            border-radius: 8px;
        }

        .sample-queries h3 {
            color: #0891b2;
            margin-bottom: 15px;
        }

        .sample-button {
            background: white;
            color: #0891b2;
            border: 2px solid #0891b2;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s ease;
        }

        .sample-button:hover {
            background: #0891b2;
            color: white;
        }

        .error-message {
            background: #fee;
            color: #c00;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            display: none;
            border-left: 4px solid #c00;
        }

        .error-message.show {
            display: block;
        }

        @media (max-width: 768px) {
            .drug-inputs {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                text-align: center;
            }

            .logo-right {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="/static/hp_logo.png" alt="HP Logo" class="logo logo-left" onerror="this.style.display='none'">
            <div class="header-content">
                <h1>Medical AI Drug Interaction Analysis</h1>
                <p>Clinical Decision Support System</p>
                <p data-zgx-device="Powered by {}">Powered by this AI Station</p>
            </div>
            <img src="/static/hp_logo.png" alt="HP Logo" class="logo logo-right" onerror="this.style.display='none'">
        </div>

        <div class="main-content">
            <div class="mode-selector">
                <button class="mode-button active" onclick="setMode('simple')" id="simpleModeBtn">
                    💊 Simple Drug Interaction
                </button>
                <button class="mode-button" onclick="setMode('complex')" id="complexModeBtn">
                    🏥 Complex Clinical Analysis
                </button>
            </div>

            <div class="sample-queries">
                <h3> Quick Demo Examples</h3>
                <div id="sampleButtons"></div>
            </div>

            <div class="input-section">
                <!-- Simple Mode -->
                <div class="simple-mode active" id="simpleMode">
                    <h2>Check Drug-Drug Interaction</h2>
                    <div class="drug-inputs">
                        <div class="input-group">
                            <label for="drug1">First Drug</label>
                            <input type="text" id="drug1" placeholder="e.g., warfarin">
                        </div>
                        <div class="input-group">
                            <label for="drug2">Second Drug</label>
                            <input type="text" id="drug2" placeholder="e.g., aspirin">
                        </div>
                    </div>
                    <button class="analyze-button" onclick="analyzeSimple()">
                         Analyze Interaction
                    </button>
                </div>

                <!-- Complex Mode -->
                <div class="complex-mode" id="complexMode">
                    <h2>Complex Patient Analysis</h2>
                    
                    <div class="input-group">
                        <label>Current Medications</label>
                        <div class="medication-list" id="medicationList"></div>
                        <div class="add-medication-row">
                            <input type="text" id="newMedication" placeholder="Enter medication name">
                            <button class="add-button" onclick="addMedication()">+ Add</button>
                        </div>
                    </div>

                    <div class="drug-inputs">
                        <div class="input-group">
                            <label for="patientAge">Patient Age</label>
                            <input type="number" id="patientAge" placeholder="e.g., 72" min="1" max="120">
                        </div>
                        <div class="input-group">
                            <label for="creatinine">Creatinine Clearance (mL/min)</label>
                            <input type="text" id="creatinine" placeholder="e.g., 45">
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Medical Conditions</label>
                        <div class="condition-checkboxes">
                            <div class="checkbox-item">
                                <input type="checkbox" id="afib" value="atrial fibrillation">
                                <label for="afib">Atrial Fibrillation</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="diabetes" value="type 2 diabetes">
                                <label for="diabetes">Type 2 Diabetes</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="ckd" value="chronic kidney disease">
                                <label for="ckd">Chronic Kidney Disease</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="htn" value="hypertension">
                                <label for="htn">Hypertension</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="cad" value="coronary artery disease">
                                <label for="cad">Coronary Artery Disease</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="gerd" value="GERD">
                                <label for="gerd">GERD</label>
                            </div>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="additionalContext">Additional Clinical Context (Optional)</label>
                        <input type="text" id="additionalContext" placeholder="e.g., Recent GI bleed, starting antibiotics for UTI">
                    </div>

                    <button class="analyze-button" onclick="analyzeComplex()">
                        🏥 Analyze Complex Case
                    </button>
                </div>
            </div>

            <div class="error-message" id="errorMessage"></div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Analyzing with Medical AI Model...</p>
            </div>

            <div class="results-section" id="resultsSection">
                <h2>   Clinical Analysis Results</h2>
                <div id="resultsContent"></div>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'simple';
        let medications = [];

        window.onload = function() {
            loadSampleQueries();
        };

        async function loadSampleQueries() {
            try {
                const response = await fetch('/api/sample_queries');
                const data = await response.json();
                
                const sampleButtons = document.getElementById('sampleButtons');
                
                if (currentMode === 'simple') {
                    sampleButtons.innerHTML = '<span>Simple examples: </span>';
                    data.simple_examples.forEach(example => {
                        const btn = document.createElement('button');
                        btn.className = 'sample-button';
                        btn.textContent = `${example.drug1} + ${example.drug2}`;
                        btn.onclick = () => {
                            document.getElementById('drug1').value = example.drug1;
                            document.getElementById('drug2').value = example.drug2;
                        };
                        sampleButtons.appendChild(btn);
                    });
                } else {
                    sampleButtons.innerHTML = '<span>Complex examples: </span>';
                    data.complex_examples.forEach(example => {
                        const btn = document.createElement('button');
                        btn.className = 'sample-button';
                        btn.textContent = example.description;
                        btn.onclick = () => loadComplexExample(example);
                        sampleButtons.appendChild(btn);
                    });
                }
            } catch (error) {
                console.error('Failed to load sample queries:', error);
            }
        }

        function loadComplexExample(example) {
            medications = [...example.medications];
            updateMedicationList();
            
            document.getElementById('patientAge').value = example.age;
            
            document.querySelectorAll('.condition-checkboxes input').forEach(cb => {
                cb.checked = false;
            });
            example.conditions.forEach(condition => {
                const cb = document.querySelector(`input[value="${condition}"]`);
                if (cb) cb.checked = true;
            });
            
            if (example.lab_values.CrCl) {
                document.getElementById('creatinine').value = example.lab_values.CrCl.replace(' mL/min', '');
            }
        }

        function setMode(mode) {
            currentMode = mode;
            
            document.getElementById('simpleModeBtn').classList.toggle('active', mode === 'simple');
            document.getElementById('complexModeBtn').classList.toggle('active', mode === 'complex');
            
            document.getElementById('simpleMode').classList.toggle('active', mode === 'simple');
            document.getElementById('complexMode').classList.toggle('active', mode === 'complex');
            
            document.getElementById('resultsSection').classList.remove('show');
            document.getElementById('errorMessage').classList.remove('show');
            
            loadSampleQueries();
        }

        function addMedication() {
            const input = document.getElementById('newMedication');
            const medication = input.value.trim();
            
            if (medication && !medications.includes(medication)) {
                medications.push(medication);
                updateMedicationList();
                input.value = '';
            }
        }

        function removeMedication(index) {
            medications.splice(index, 1);
            updateMedicationList();
        }

        function updateMedicationList() {
            const list = document.getElementById('medicationList');
            list.innerHTML = medications.map((med, i) => 
                `<span class="medication-item">${med}<span class="remove" onclick="removeMedication(${i})">×</span></span>`
            ).join('');
        }

        async function analyzeSimple() {
            const drug1 = document.getElementById('drug1').value.trim();
            const drug2 = document.getElementById('drug2').value.trim();
            
            if (!drug1 || !drug2) {
                showError('Please enter both drug names');
                return;
            }
            
            const loading = document.getElementById('loading');
            const resultsSection = document.getElementById('resultsSection');
            const errorMessage = document.getElementById('errorMessage');
            
            loading.classList.add('show');
            resultsSection.classList.remove('show');
            errorMessage.classList.remove('show');
            
            try {
                const response = await fetch('/api/simple_interaction', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ drug1, drug2 })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    displaySimpleResults(data);
                } else {
                    throw new Error('Analysis failed');
                }
            } catch (error) {
                showError(`Error: ${error.message}`);
            } finally {
                loading.classList.remove('show');
            }
        }

        async function analyzeComplex() {
            if (medications.length === 0) {
                showError('Please add at least one medication');
                return;
            }
            
            const age = document.getElementById('patientAge').value;
            if (!age) {
                showError('Please enter patient age');
                return;
            }
            
            const conditions = [];
            document.querySelectorAll('.condition-checkboxes input:checked').forEach(cb => {
                conditions.push(cb.value);
            });
            
            const labValues = {};
            const creatinine = document.getElementById('creatinine').value;
            if (creatinine) {
                labValues['CrCl'] = `${creatinine} mL/min`;
            }
            
            const additionalContext = document.getElementById('additionalContext').value;
            
            const loading = document.getElementById('loading');
            const resultsSection = document.getElementById('resultsSection');
            const errorMessage = document.getElementById('errorMessage');
            
            loading.classList.add('show');
            resultsSection.classList.remove('show');
            errorMessage.classList.remove('show');
            
            try {
                const response = await fetch('/api/complex_interaction', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        medications,
                        age: parseInt(age),
                        conditions,
                        lab_values: labValues,
                        additional_context: additionalContext
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    displayComplexResults(data);
                } else {
                    throw new Error('Analysis failed');
                }
            } catch (error) {
                showError(`Error: ${error.message}`);
            } finally {
                loading.classList.remove('show');
            }
        }

        function displaySimpleResults(data) {
            const resultsContent = document.getElementById('resultsContent');
            const severity = data.severity || 'Unknown';
            const riskClass = {
                'None': 'none',
                'Low': 'low',
                'Moderate': 'moderate',
                'High': 'high',
                'Contraindicated': 'high',
                'Unknown': 'moderate'
            }[severity] || 'moderate';
            const provenance = data.db_match
                ? `Severity sourced from clinical DDI database · Analysis time: ${data.inference_time}s`
                : data.rag_used
                ? `RAG-assisted · Analysis time: ${data.inference_time}s`
                : `Analysis time: ${data.inference_time}s`;
            resultsContent.innerHTML = `
                <div class="result-card">
                    <div class="result-header">
                        <span class="result-title">Drug Interaction: ${data.drug1} + ${data.drug2}</span>
                        <span class="risk-badge risk-${riskClass}">${severity}</span>
                    </div>
                    <div class="result-content">${data.analysis}</div>
                    <div class="inference-time">${provenance}</div>
                </div>
            `;
            document.getElementById('resultsSection').classList.add('show');
        }

        function displayComplexResults(data) {
            const riskClass = data.risk_level.toLowerCase();
            const resultsContent = document.getElementById('resultsContent');
            
            resultsContent.innerHTML = `
                <div class="result-card">
                    <div class="result-header">
                        <span class="result-title">Complex Patient Analysis</span>
                        <span class="risk-badge risk-${riskClass}">Risk Score: ${data.risk_score}/10 (${data.risk_level})</span>
                    </div>
                    <div class="result-content">${data.analysis}</div>
                    <div class="inference-time">Analysis time: ${data.inference_time} seconds</div>
                </div>
            `;
            
            document.getElementById('resultsSection').classList.add('show');
        }

        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.classList.add('show');
            setTimeout(() => {
                errorEl.classList.remove('show');
            }, 5000);
        }

        document.getElementById('newMedication').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addMedication();
            }
        });
    </script>
<script>

<script>
// Fill any [data-zgx-device] element with the machine the Demo Center detected.
//
// Every demo frontend used to hardcode "Powered by HP ZGX Nano" -- and the
// pharmacy one went further with "with NVIDIA Grace Blackwell GB10". At an
// AMD-funded show those lines sell the wrong vendor from the demo's own screen,
// and there is no way to fix them except editing HTML per event.
//
// The attribute's value is a template; "{}" is replaced by the device label.
//   <span data-zgx-device="Powered by {}">Powered by this AI Station</span>
//
// If /sysinfo cannot be reached the element keeps whatever it already says, so
// the fallback text in the markup must name NO vendor. A demo that stays
// generic is fine; a demo that confidently names the wrong silicon is not.
//
// Source of truth: demos/scripts/zgx-device-label.js. The copies inlined into
// each frontend are kept in sync by scripts/sync_device_label.sh, and checked
// by scripts/audit_hardware_strings.sh.
(function () {
  var els = document.querySelectorAll('[data-zgx-device]');
  if (!els.length) return;
  fetch('http://' + location.hostname + ':8086/sysinfo')
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (hw) {
      if (!hw || !hw.device_label) return;
      for (var i = 0; i < els.length; i++) {
        var tpl = els[i].getAttribute('data-zgx-device') || '{}';
        els[i].textContent = tpl.replace('{}', hw.device_label);
      }
    })
    .catch(function () { /* offline or launcher not running: keep the neutral text */ });
})();
</script>

<style>
/* ZGX demo chrome — the shared frame every demo wears.
 *
 * Fixed: the bar, the meter strip, the footer. Free: everything between them.
 * Tokens live on :root so a demo can match its own palette without forking the
 * layout; scripts/audit_ui_standard.sh checks nobody forks the layout anyway.
 *
 * The meter vocabulary (.zgx-meter / -label / -value / -sub) is lifted from
 * grant-machine's web/styles.css, which already had it working — including
 * font-variant-numeric: tabular-nums, the detail that stops a climbing counter
 * jittering as its digits change width.
 */

:root {
  --zgx-bar-bg: #0e1420;
  --zgx-bar-fg: #e6edf6;
  --zgx-bar-dim: #8fa3bd;
  --zgx-bar-line: #1f2b3d;
  --zgx-accent: #0096d6;         /* HP blue */
  --zgx-ok: #35c46b;
  --zgx-warn: #d9a441;
  --zgx-bar-h: 56px;
}

#zgx-chrome { display: none; }   /* the marker element itself is never shown */

.zgx-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--zgx-bar-h);
  z-index: 2147483000;           /* above demo overlays, below nothing */
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 16px;
  background: var(--zgx-bar-bg);
  color: var(--zgx-bar-fg);
  border-bottom: 1px solid var(--zgx-bar-line);
  font: 500 13px/1.2 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing: border-box;
}
.zgx-bar *, .zgx-bar *::before, .zgx-bar *::after { box-sizing: border-box; }

/* The approved logo artwork has an opaque white background, so it sits on a
 * light plate rather than being alpha-keyed. */
.zgx-logo-plate {
  flex: 0 0 auto;
  background: #fff;
  border-radius: 6px;
  padding: 4px 7px;
  display: flex;
  align-items: center;
}
.zgx-logo-plate img { display: block; height: 30px; width: auto; }

.zgx-titles { flex: 0 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.zgx-title { font-size: 14px; font-weight: 650; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.zgx-subtitle { font-size: 11px; color: var(--zgx-bar-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.zgx-meters { flex: 1 1 auto; display: flex; gap: 14px; justify-content: flex-end; align-items: center; overflow: hidden; }

.zgx-meter { display: flex; flex-direction: column; align-items: flex-end; min-width: 62px; }
.zgx-meter-label { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--zgx-bar-dim); white-space: nowrap; }
.zgx-meter-value {
  font-size: 17px; font-weight: 700; line-height: 1.15;
  font-variant-numeric: tabular-nums;   /* keeps a counting number from jittering */
  white-space: nowrap;
}
.zgx-meter-sub { font-size: 10px; color: var(--zgx-bar-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
.zgx-meter-value.zgx-unknown { color: var(--zgx-bar-dim); font-weight: 500; }
.zgx-meter-value.zgx-accent { color: var(--zgx-accent); }

.zgx-sep { width: 1px; align-self: stretch; margin: 10px 0; background: var(--zgx-bar-line); flex: 0 0 auto; }

.zgx-device { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; max-width: 210px; }
.zgx-device-label { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 210px; }
.zgx-device-sub { font-size: 10px; color: var(--zgx-bar-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 210px; }

/* The chrome is fixed, so the page is pushed down by exactly its height. */
body.zgx-chromed { padding-top: var(--zgx-bar-h) !important; }

/* The chrome owns the logo, so a demo's own copy is hidden rather than shown
 * twice. Five demos shipped their own hp_logo.png (three DIFFERENT files under
 * the same name), and stacking the canonical one above a divergent one is the
 * opposite of a standard.
 *
 * Safe to match this broadly: the chrome's own logo is a data: URI, so it can
 * never match src*="hp_logo". Rule removed and the demo's logo returns. */
body.zgx-chromed img[src*="hp_logo"] { display: none !important; }

.zgx-foot {
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: 2147482999;
  display: flex; justify-content: space-between; align-items: center;
  gap: 12px; padding: 4px 14px;
  background: var(--zgx-bar-bg); color: var(--zgx-bar-dim);
  border-top: 1px solid var(--zgx-bar-line);
  font: 500 11px/1.3 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
body.zgx-chromed-foot { padding-bottom: 26px !important; }
.zgx-foot .zgx-local { color: var(--zgx-ok); }

@media (max-width: 1100px) {
  .zgx-meter:nth-child(n+5) { display: none; }   /* shed the least critical meters first */
  .zgx-subtitle { display: none; }
}
@media (max-width: 760px) {
  .zgx-meters { display: none; }
}

<script>
/* ZGX demo chrome — builds the shared bar and owns every poll.
 *
 * One rule this file will not bend: a value that was not received renders as an
 * em-dash, never as 0. Zero watts, zero degrees and zero tokens are all readings
 * an audience will believe. This project has repeatedly found meters that showed
 * a plausible number while measuring nothing — a hardcoded "102 GB / 128 GB"
 * captioned as live NVML, a launcher bar of typed-in green ticks, a token count
 * that was a chars/4 guess. The chrome does not add to that list.
 *
 * Data sources, both optional:
 *   GET  {launcher}/telemetry   host GPU/CPU — read by the BROWSER, not the
 *                               demo's backend, so containerised demos with no
 *                               GPU tooling and no host route still show it.
 *   GET  ./api/metrics          the demo's own tokens. 404 = no LLM, panel hidden.
 *   GET  {launcher}/sysinfo     device identity.
 */
(function () {
  "use strict";

  var mount = document.getElementById("zgx-chrome");
  if (!mount || window.__zgxChromeLoaded) return;
  window.__zgxChromeLoaded = true;

  var LAUNCHER = "http://" + location.hostname + ":8086";
  var DASH = "—";

  var cfg = {
    title: mount.getAttribute("data-title") || document.title || "ZGX Demo",
    subtitle: mount.getAttribute("data-subtitle") || "",
    logo: mount.getAttribute("data-logo") || "hp_logo.png",
    metrics: mount.getAttribute("data-metrics") || "/api/metrics",
    foot: mount.getAttribute("data-foot") !== "off"
  };

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function meter(id, label, sub) {
    var m = el("div", "zgx-meter");
    m.appendChild(el("span", "zgx-meter-label", label));
    var v = el("span", "zgx-meter-value zgx-unknown", DASH);
    v.id = "zgx-" + id;
    m.appendChild(v);
    var s = el("span", "zgx-meter-sub", sub || "");
    s.id = "zgx-" + id + "-sub";
    m.appendChild(s);
    return m;
  }

  // ── build ────────────────────────────────────────────────────────────────
  var bar = el("div", "zgx-bar");

  var plate = el("div", "zgx-logo-plate");
  var img = document.createElement("img");
  img.src = cfg.logo;
  img.alt = "HP";
  // A demo served from a subpath may not resolve the relative logo; fall back
  // to the launcher's copy rather than showing a broken-image glyph on stage.
  img.onerror = function () {
    if (img.dataset.fellBack) { plate.style.display = "none"; return; }
    img.dataset.fellBack = "1";
    img.src = LAUNCHER + "/ui/brand/hp_logo.png";
  };
  plate.appendChild(img);
  bar.appendChild(plate);

  var titles = el("div", "zgx-titles");
  titles.appendChild(el("div", "zgx-title", cfg.title));
  if (cfg.subtitle) titles.appendChild(el("div", "zgx-subtitle", cfg.subtitle));
  bar.appendChild(titles);

  var meters = el("div", "zgx-meters");
  var tokenPanel = el("div", "zgx-meters");          // hidden until /api/metrics answers
  tokenPanel.style.display = "none";
  tokenPanel.style.flex = "0 0 auto";
  tokenPanel.appendChild(meter("tokens", "Tokens", "this session"));
  tokenPanel.appendChild(meter("tps", "Tok/s", ""));
  meters.appendChild(tokenPanel);
  meters.appendChild(el("div", "zgx-sep"));
  meters.appendChild(meter("gpu", "GPU", ""));
  meters.appendChild(meter("power", "Power", ""));
  meters.appendChild(meter("temp", "Temp", ""));
  meters.appendChild(meter("mem", "Memory", ""));
  meters.appendChild(meter("cpu", "CPU", ""));
  bar.appendChild(meters);

  bar.appendChild(el("div", "zgx-sep"));
  var dev = el("div", "zgx-device");
  var devLabel = el("div", "zgx-device-label", DASH);
  devLabel.id = "zgx-device-label";
  var devSub = el("div", "zgx-device-sub", "");
  devSub.id = "zgx-device-sub";
  dev.appendChild(devLabel);
  dev.appendChild(devSub);
  bar.appendChild(dev);

  document.body.appendChild(bar);
  document.body.classList.add("zgx-chromed");

  if (cfg.foot) {
    var foot = el("div", "zgx-foot");
    var left = el("span", "zgx-local", "All inference on this device · no cloud");
    var right = el("span", null, "");
    right.id = "zgx-foot-right";
    foot.appendChild(left);
    foot.appendChild(right);
    document.body.appendChild(foot);
    document.body.classList.add("zgx-chromed-foot");
  }

  // ── render helpers ───────────────────────────────────────────────────────
  function set(id, value, unit, digits) {
    var n = document.getElementById("zgx-" + id);
    if (!n) return;
    if (value === null || value === undefined || value === "" || Number.isNaN(value)) {
      n.textContent = DASH;
      n.classList.add("zgx-unknown");
      return;
    }
    var shown = (typeof value === "number" && digits !== undefined) ? value.toFixed(digits) : value;
    n.textContent = shown + (unit || "");
    n.classList.remove("zgx-unknown");
  }
  function setSub(id, text) {
    var n = document.getElementById("zgx-" + id + "-sub");
    if (n) n.textContent = text == null ? "" : text;
  }

  // ── hardware, from the launcher ──────────────────────────────────────────
  function pollTelemetry() {
    fetch(LAUNCHER + "/telemetry", { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (t) {
        if (!t) throw new Error("no telemetry");
        set("gpu", t.util_pct, "%");
        set("power", t.power_w, " W", 0);
        set("temp", t.temp_c, "°C");
        set("mem", t.mem_used_gb, " GB", 1);
        setSub("mem", t.mem_total_gb ? "of " + t.mem_total_gb + " GB" : "");
        set("cpu", t.cpu_pct, "%", 0);
        setSub("cpu", t.ram_pct != null ? "RAM " + Math.round(t.ram_pct) + "%" : "");
        setSub("gpu", t.source && t.source !== "none" ? t.source : "");
        var fr = document.getElementById("zgx-foot-right");
        if (fr) {
          fr.textContent = [t.vendor && t.vendor !== "unknown" ? t.vendor : null,
                            t.source && t.source !== "none" ? t.source : null]
                           .filter(Boolean).join(" · ");
        }
      })
      .catch(function () {
        // Launcher down: clear every hardware meter. Leaving the last reading
        // on screen would be a stale number presented as live.
        ["gpu", "power", "temp", "mem", "cpu"].forEach(function (k) { set(k, null); setSub(k, ""); });
      });
  }

  // ── tokens, from the demo itself ─────────────────────────────────────────
  var tokensSupported = null;
  function pollMetrics() {
    if (tokensSupported === false) return;
    fetch(cfg.metrics, { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (m) {
        if (!m || typeof m.total_tokens !== "number") throw new Error("no metrics");
        tokensSupported = true;
        tokenPanel.style.display = "";
        var approx = m.estimated ? "≈" : "";
        set("tokens", approx + m.total_tokens.toLocaleString());
        setSub("tokens", m.requests != null ? m.requests + " request" + (m.requests === 1 ? "" : "s") : "this session");
        set("tps", m.tps, "", 1);
      })
      .catch(function () {
        // A demo with no LLM serves no /api/metrics. Hide the panel rather than
        // show a zero that would read as "this demo processed nothing".
        if (tokensSupported === null) { tokensSupported = false; tokenPanel.style.display = "none"; }
      });
  }

  function loadIdentity() {
    fetch(LAUNCHER + "/sysinfo", { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (hw) {
        if (!hw) return;
        var label = document.getElementById("zgx-device-label");
        var sub = document.getElementById("zgx-device-sub");
        label.textContent = label.title = hw.device_label || DASH;
        // Some vendors' device names run long (marketing name plus arch id); the CSS
        // ellipsizes both lines and the title keeps the full text on hover.
        sub.textContent = sub.title =
          [hw.accelerator !== "unknown" ? hw.accelerator : null, hw.arch].filter(Boolean).join(" · ");
      })
      .catch(function () {
        document.getElementById("zgx-device-label").textContent = "hardware unknown";
      });
  }

  loadIdentity();
  pollTelemetry();
  pollMetrics();
  setInterval(pollTelemetry, 2000);
  setInterval(pollMetrics, 2000);
})();
</script>
<!-- zgx-ui:end -->
